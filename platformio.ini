[env:m5dial]
board_build.filesystem = littlefs
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_port = COM*
monitor_speed = 115200
lib_deps =
  m5stack/M5Dial
  m5stack/M5Unified
  m5stack/M5GFX
  bblanchon/ArduinoJson
  knolleary/PubSubClient @ ^2.8
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
