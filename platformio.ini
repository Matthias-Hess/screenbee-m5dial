[env:m5dial]
board_build.filesystem = littlefs
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_port = COM*
monitor_speed = 115200
lib_deps =
  m5stack/M5Dial
  m5stack/M5Unified
  m5stack/M5GFX
  bblanchon/ArduinoJson
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit GFX Library
  olikraus/U8g2
  https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
  ; Pinned to the exact commit MqttEPaperDisplay2 has been running in
  ; production with (2026-08-09: an unpinned fetch here landed 77d0dce,
  ; ~10 months newer than the e-paper repo's cached 174573d). Worth
  ; keeping pinned regardless (don't let this silently drift on a future
  ; clean checkout), but **this was NOT the fix**: tested on hardware
  ; (2026-08-09) and produced the exact same crash as the newer commit -
  ; not just the same symptom, but byte-identical register dump (same PC
  ; 0x403743c0, same EXCVADDR 0x080305e0, same corrupted backtrace) across
  ; both miniz versions. Rules out an upstream miniz regression as the
  ; cause. The bug is almost certainly in this project's own integration
  ; code (TestInterfaceServer.cpp/ProjectInstaller.cpp) or a deeper
  ; toolchain/ABI interaction, not in miniz itself - look there next, not
  ; at miniz's version history again.
  https://github.com/richgel999/miniz.git#174573d60290f447c13a2b1b3405de2b96e27d6c
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Default Arduino loop-task stack (8192 bytes, cores/esp32/main.cpp's
  ; ARDUINO_LOOP_STACK_SIZE fallback) isn't enough for ProjectInstaller's
  ; zip extraction: miniz's tinfl_decompressor (the inflate/decompress
  ; state struct, mostly its Huffman lookup tables - m_look_up[3][1024]
  ; alone is 6KB) is allocated as a plain local/stack variable inside
  ; mz_zip_reader_extract_to_mem_no_alloc1(), not on the heap. Even a
  ; trivially small zip entry pushes ~9-10KB of locals onto whatever task
  ; calls into it - here, the Arduino loop task, since TestInterfaceServer's
  ; WebServer upload handling runs synchronously inside loop() ->
  ; handleClient(). Confirmed via bisection (2026-08-09): every call up
  ; through mz_zip_reader_init_mem() completed and logged fine; the
  ; hang/crash always happened silently *inside*
  ; mz_zip_reader_extract_file_to_heap() itself, with a "Stack canary
  ; watchpoint triggered (IDLE0)" panic - the classic ESP32 stack-overflow
  ; signature, not a miniz configuration bug (ruled out separately: none of
  ; miniz's own structs change layout based on the macros this project
  ; sets, and the reader/extraction path has zero dependency on the
  ; deflate/tdefl side this project disables).
  ; PlatformIO's board_build.arduino.loop_stack_size setting does NOT take
  ; effect on this framework version - it only wires through
  ; CONFIG_ARDUINO_LOOP_STACK_SIZE (an ESP-IDF sdkconfig value), but this
  ; platform's Arduino core builds its own cores/esp32/*.c files directly
  ; rather than as an sdkconfig-driven IDF component, so that config value
  ; is never generated/read. main.cpp's own fallback chain checks for a
  ; plain ARDUINO_LOOP_STACK_SIZE #define FIRST though, so defining it
  ; directly as a build flag is what actually reaches loopTask's
  ; xTaskCreateUniversal() call (confirmed by reading
  ; framework-arduinoespressif32/cores/esp32/main.cpp directly - don't
  ; trust the PlatformIO board_build option name for this platform version
  ; without checking, it silently does nothing rather than erroring).
  ; 32KB still crashed (2026-08-09) - not with the watchdog-spam pattern
  ; this time, but a different "BREAK instr" Guru Meditation with an
  ; obviously-corrupted backtrace (addresses like 0x0803xxxx, well outside
  ; any valid ESP32-S3 memory region) at the exact same call site
  ; (mz_zip_reader_extract_file_to_heap). At the time this looked like
  ; still-insufficient stack, so it was bumped to 64KB next - but that
  ; introduced a NEW, worse regression: even the built-in test project
  ; (a trivial local JSON file, nothing to do with zip/miniz at all) started
  ; failing to load, immediately after being freshly written, on a freshly
  ; erased filesystem. Root cause: xTaskCreateUniversal() allocates a
  ; task's stack from the general heap, not a separate pool - 64KB
  ; reserved for the loop task's stack is 64KB less available for
  ; ArduinoJson's own dynamic allocations during normal project parsing.
  ; 32KB never broke project loading (confirmed both before and after this
  ; regression was found), so back to 32KB. Conclusively ruled out as the
  ; crash cause (2026-08-09): TestInterfaceServer::runValidateAndExtractOnDedicatedTask()
  ; runs the entire extraction call chain on its own dedicated FreeRTOS
  ; task with a fresh 40KB stack, completely isolated from the loop task's
  ; 32KB - the DEFLATE-entry crash still reproduces with the *exact same*
  ; register dump (same EXCVADDR, same corrupted backtrace pattern) as
  ; every other stack configuration tried. Not a stack-depth problem at
  ; any size. Keep 32KB as reasonable headroom over the unmodified 8KB
  ; default for the loop task specifically, unrelated to the still-open
  ; extraction bug.
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DMINIZ_EXPORT=
  -Ilib/miniz
  ; M5GFX vendors its own miniz subset (lgfx_miniz.c) for PNG compression,
  ; which duplicate-symbol-conflicts at link time with this project's own
  ; miniz if both compile the tdefl_* (compress) side. ProjectInstaller only
  ; ever reads/extracts zips (mz_zip_reader_*, needs tinfl_/inflate), never
  ; writes one. MINIZ_NO_ARCHIVE_WRITING_APIS alone isn't enough - it only
  ; guards mz_zip_writer_* wrapper call sites inside miniz_zip.c, while
  ; miniz_tdef.c's tdefl_* primitives compile unconditionally regardless of
  ; whether anything calls them (confirmed against the vendored miniz.h:
  ; miniz_tdef.c's entire contents are wrapped in
  ; "#ifndef MINIZ_NO_DEFLATE_APIS", nothing narrower). Setting that
  ; instead compiles miniz_tdef.c.o down to nothing, so libminiz.a has no
  ; tdefl_* member left for the linker to ever pull in - no conflict left
  ; to have. Must be a global build_flag, not a local #define in
  ; ProjectInstaller.cpp, since that wouldn't reach miniz's own
  ; separately-compiled .c files.
  -DMINIZ_NO_DEFLATE_APIS
  ; Tested and ruled out (2026-08-09): miniz already auto-detects
  ; MINIZ_USE_UNALIGNED_LOADS_AND_STORES=0 for non-x86 CPUs (which makes
  ; MZ_READ_LE32/16 and tinfl's LZ77 match-copy fast-path use safe
  ; byte-wise access, not raw uint32_t* pointer casts, on Xtensa) - pinning
  ; it explicitly here changed nothing. Kept anyway as documentation that
  ; this was checked: the DEFLATE-entry extraction crash produces the
  ; *exact same* register dump (same EXCVADDR 0x0609064d, same A8
  ; 0x06090605) with this flag forced as without it, so an
  ; unaligned-access hardware trap is not the cause either.
  -DMINIZ_USE_UNALIGNED_LOADS_AND_STORES=0

; JTAG/GDB debug session env (2026-08-09) - identical to env:m5dial except
; build_type=debug (-Og -g3, PlatformIO's mechanism), so GDB stops showing
; "<optimized out>" for locals/parameters and register-to-source-variable
; mapping is trustworthy. Confirmed live via the M5 Dial's built-in
; USB-JTAG (esp32s3-builtin.cfg - needs a one-time Zadig WinUSB driver
; swap on the "USB JTAG/serial debug unit (Interface 2)" node specifically,
; leave Interface 0/the COM port's driver alone; after that,
; `openocd -f share/openocd/scripts/board/esp32s3-builtin.cfg` from
; tool-openocd-esp32, then `xtensa-esp32s3-elf-gdb -x script.gdb --batch
; firmware.elf` from tool-xtensa-esp-elf-gdb, both already bundled with
; the espressif32 PlatformIO platform).
;
; Live finding (2026-08-09), the real payoff of setting this up:
; `pZip->m_pState` (the pointer mz_zip_reader_extract_to_mem_no_alloc1
; dereferences right before the crash, miniz_zip.c:1685) is confirmed
; ALREADY invalid (0x6090605, garbage) at the very entry of that function
; call - not corrupted partway through it. Since `mz_zip_reader_file_stat`
; (called moments earlier, on the same `zip` struct) demonstrably still
; had a valid m_pState (it returned correct comp/uncomp sizes read
; through it), the corruption happens in the narrow window between that
; file_stat call succeeding and the extract call being entered - in
; ProjectInstaller.cpp's peekProjectDeviceId(), that's the malloc() for
; the destination buffer plus its memset(). A precise watchpoint on
; `zip.m_pState` set right after file_stat (to catch the exact
; instruction that overwrites it) was attempted twice more but never
; armed successfully: first, a breakpoint set immediately after `monitor
; reset halt` was silently skipped entirely (execution went straight to
; the crash site instead) - a known ESP32 JTAG gotcha where flash-mapped
; breakpoints set too soon after reset can resolve against a not-yet-
; finalized flash mapping; switching to `monitor halt` (attach to an
; already-running target instead of resetting) avoided that, but then
; the USB-JTAG connection itself died mid-session
; (LIBUSB_ERROR_IO/"device not found" flooding from OpenOCD) - the same
; USB/power flakiness this specific unit has shown all session for its
; plain serial connection, apparently also afflicting the JTAG interface
; under load (active WiFi + an attach-while-running debug session). Not
; a debugging dead end, a hardware-stability one: next attempt should
; either use the extra dedicated power source during the JTAG session
; too (it was only used for flashing/normal operation this session, not
; tried during active JTAG), or debug on a physically different M5 Dial
; unit if this one's USB flakiness keeps interrupting sessions.
[env:m5dial_debug]
extends = env:m5dial
build_type = debug
