[env:m5dial]
board_build.filesystem = littlefs
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_port = COM*
monitor_speed = 115200
lib_deps =
  m5stack/M5Dial
  m5stack/M5Unified
  m5stack/M5GFX
  bblanchon/ArduinoJson
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit GFX Library
  olikraus/U8g2
  https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
  ; miniz is vendored directly in lib/miniz/ (copied from upstream commit
  ; 174573d60290f447c13a2b1b3405de2b96e27d6c, the commit MqttEPaperDisplay2
  ; runs in production) rather than fetched here as a git lib_dep - see
  ; lib/miniz/miniz_zip.c's 2026-08-09 patch comment on
  ; mz_zip_reader_extract_iter_new() for why: a real upstream bug (an OOM
  ; cleanup path frees a non-heap pointer for in-memory archives) that
  ; needed a local source patch, not just a version pin.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; 32KB loop-task stack (default is 8192). Not related to the DEFLATE zip
  ; bug below - that turned out to be entirely heap-side, not stack-side -
  ; kept as reasonable headroom regardless. PlatformIO's
  ; board_build.arduino.loop_stack_size does NOT work on this framework
  ; version (only wires CONFIG_ARDUINO_LOOP_STACK_SIZE, an ESP-IDF sdkconfig
  ; value this platform's Arduino core never generates); main.cpp's own
  ; fallback chain reads the plain ARDUINO_LOOP_STACK_SIZE #define first,
  ; which this build flag reaches - confirmed by reading
  ; framework-arduinoespressif32/cores/esp32/main.cpp directly. 64KB was
  ; tried and reverted: xTaskCreateUniversal() allocates a task's stack from
  ; the general heap, and 64KB reserved here starved ArduinoJson's own
  ; allocations during normal project loading.
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DMINIZ_EXPORT=
  -Ilib/miniz
  ; M5GFX vendors its own miniz subset (lgfx_miniz.c) for PNG compression,
  ; which duplicate-symbol-conflicts at link time with this project's own
  ; miniz if both compile the tdefl_* (compress) side. ProjectInstaller only
  ; ever reads/extracts zips (mz_zip_reader_*, needs tinfl_/inflate), never
  ; writes one. MINIZ_NO_ARCHIVE_WRITING_APIS alone isn't enough - it only
  ; guards mz_zip_writer_* wrapper call sites inside miniz_zip.c, while
  ; miniz_tdef.c's tdefl_* primitives compile unconditionally regardless of
  ; whether anything calls them (confirmed against the vendored miniz.h:
  ; miniz_tdef.c's entire contents are wrapped in
  ; "#ifndef MINIZ_NO_DEFLATE_APIS", nothing narrower). Setting that
  ; instead compiles miniz_tdef.c.o down to nothing, so libminiz.a has no
  ; tdefl_* member left for the linker to ever pull in - no conflict left
  ; to have. Must be a global build_flag, not a local #define in
  ; ProjectInstaller.cpp, since that wouldn't reach miniz's own
  ; separately-compiled .c files.
  -DMINIZ_NO_DEFLATE_APIS
  -DMINIZ_USE_UNALIGNED_LOADS_AND_STORES=0

; JTAG/GDB debug session env - identical to env:m5dial except build_type=debug
; (-Og -g3), so GDB stops showing "<optimized out>" for locals/parameters.
; Confirmed working via the M5 Dial's built-in USB-JTAG (esp32s3-builtin.cfg -
; needs a one-time Zadig WinUSB driver swap on the "USB JTAG/serial debug
; unit (Interface 2)" node specifically, leave Interface 0/the COM port's
; driver alone; after that, `openocd -f
; share/openocd/scripts/board/esp32s3-builtin.cfg` from tool-openocd-esp32,
; then `xtensa-esp32s3-elf-gdb -x script.gdb --batch firmware.elf` from
; tool-xtensa-esp-elf-gdb, both bundled with the espressif32 PlatformIO
; platform). Used (2026-08-09) to root-cause a DEFLATE-zip-extraction crash
; that took two separate bugs to fully resolve - see
; docs/device-contract.md (designer repo) §8 for the full investigation
; history and lib/miniz/miniz_zip.c's patch comment on
; mz_zip_reader_extract_iter_new() for the final upstream-miniz bug found.
; JTAG watchpoints proved unreliable on this board's dual-core USB-JTAG
; (armed but silently never fired, repeatedly) - the padded-canary technique
; in ProjectInstaller.cpp's own history (see git log) ended up doing the
; real bisection work instead, no hardware debugger required for that part.
[env:m5dial_debug]
extends = env:m5dial
build_type = debug
; Reproduces the DEFLATE-extraction crash from main.cpp's runJtagDebugTest()
; (JTAG_DEBUG_TEST-gated, see its comment) before setupWiFi() runs - no WiFi
; radio activity competing with the JTAG connection for USB bandwidth during
; the crash, unlike triggering it via a real HTTP upload.
build_flags =
  ${env:m5dial.build_flags}
  -DJTAG_DEBUG_TEST

; Power-state measurement build - cycles the display through normal /
; backlight-off / panel-sleep / light-sleep forever (runPowerStateTest(),
; POWER_STATE_TEST-gated in main.cpp - see its own comment for the states
; and why deep sleep isn't one of them). Deliberately does not connect
; WiFi/MQTT, to isolate what the display itself costs. Flash this env,
; then read current draw off a multimeter in line with the device's power
; input while watching the serial log for which state is currently active.
[env:m5dial_powertest]
extends = env:m5dial
build_flags =
  ${env:m5dial.build_flags}
  -DPOWER_STATE_TEST
